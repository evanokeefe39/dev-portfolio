[project]
name = "data-pipeline"
version = "0.1.0"
description = "Local snapshot generator for the dev portfolio: ingests Claude/Pi/Codex session JSONL and git history, computes developer metrics over five ranges, writes public/data/current.json."
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1.0"]
[project.optional-dependencies]
dev = ["pytest>=8.0", "tzdata>=2024.1"]

[project.scripts]
snapshot = "data_pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
