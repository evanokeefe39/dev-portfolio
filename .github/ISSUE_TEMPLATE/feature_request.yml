name: Feature request
description: Propose a new capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: intent
    attributes:
      label: Intent
      description: The user or business outcome, not the technical implementation.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant existing code, constraints, or prior decisions.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that define "done".
