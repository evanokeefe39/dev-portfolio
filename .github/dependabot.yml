version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      three:
        patterns:
          - 'three'
          - '@react-three/*'
          - '@types/three'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
