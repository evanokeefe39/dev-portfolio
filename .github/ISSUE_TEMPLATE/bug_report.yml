name: Bug report
description: Report a defect with steps to reproduce
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, browser, Node version, device
